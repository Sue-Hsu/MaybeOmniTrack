<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>財務看看｜安全維護中</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #e8efff 0, #f4f7fb 45%, #eef2f7 100%);
        }

        main {
            width: min(620px, 100%);
            padding: clamp(28px, 6vw, 48px);
            border: 1px solid #d8e0ec;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 55px rgba(31, 49, 82, 0.12);
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: #e9efff;
            color: #3459c7;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(28px, 6vw, 40px);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: #526078;
            font-size: 17px;
            line-height: 1.8;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #eef8f1;
            color: #247347;
            font-weight: 700;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2ca56a;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">🛡️</div>
        <h1>財務看看安全維護中</h1>
        <p>系統正在更新登入與資料安全機制，暫時停止使用。完成檢查後會重新開放。</p>
        <div class="status"><span class="dot"></span>資料安全維護進行中</div>
    </main>
</body>
</html>
